<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>牌面预览 · 宜兴麻将</title>
<style>
  :root{
    --felt:#1d5c3f; --felt2:#12402c;
    --tile:#faf6ea; --tile-edge:#d8cfb8; --tile-text:#3a3226;
    --accent:#e8c15a; --red:#c0392b; --gold:#f0c96a;
    --panel:rgba(0,0,0,.28);
    /* 牌尺寸集中在这里，断点内只改「宽度」基准值。
       所有高度都用 --tile-ar 从宽度算出来，这样无论屏幕多窄，牌面比例都不会变形
       （旧版把宽高分别写死，窄屏被 flex 挤压后宽高比从 0.71 掉到 0.52，牌面糊成一团）。
       注意：这些变量必须留在本块内——scripts/gen_tiles_preview.py 只读取第一个 :root。 */
    --tile-ar:1.381;                                              /* 58 / 42，牌面宽高比 */
    --tile-w:42px;  --tile-h:calc(var(--tile-w) * var(--tile-ar));
    --small-w:30px; --small-h:calc(var(--small-w) * var(--tile-ar));
    --mini-w:30px;  --mini-h:calc(var(--mini-w) * var(--tile-ar));
    /* 上下家那一列只放「信息条+牌背+弃牌」，给死宽度；
       剩下的全部给中间那条 —— 对家/自己的弃牌带就在中间，
       越宽就越少折行，也就越不吃高度（横屏最缺的正是高度）。 */
    --side-w:104px;
    /* 对手牌背。对家横排，你看得到牌背的宽面，所以按牌的比例叠；
       上下家竖排，你看到的是牌的侧棱，所以画成一叠薄片——更接近真麻将的观感。
       ⚠ 这两样都不能占独立列：竖屏宽度是手牌唯一的敌人（见 --hand-w）。 */
    --back-w:30px;  --back-h:calc(var(--back-w) * var(--tile-ar)); --back-step:19px;
    --sback-w:24px; --sback-h:9px;
    --hand-gap:3px;
    /* 手牌一行必须塞下 14 张：左右各 6px 内边距 + 13 个间隙 = 51px。
       用 min() 保证既不超过基准档，也永不溢出、永不被压扁。 */
    --hand-w:min(var(--tile-w), calc((100vw - 51px) / 14));
    --hand-h:calc(var(--hand-w) * var(--tile-ar));
    --zoom-w:42px;  --zoom-h:calc(var(--zoom-w) * var(--tile-ar));
    /* 中央放大的「最后一张弃牌」。竖屏弃牌只有 26px 宽，靠牌河看不清这张 */
    --ld-w:min(64px, 18vw);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:radial-gradient(ellipse at 50% 30%, var(--felt) 0%, var(--felt2) 100%);
    color:#eee; padding:24px;
    font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  }
  h1{ font-size:20px; color:var(--gold); letter-spacing:2px; margin-bottom:4px; }
  h2{ font-size:14px; color:#a8c3b5; font-weight:400; margin:22px 0 10px; }
  .row{ display:flex; flex-wrap:wrap; gap:8px; }
  .tile{
    width:var(--tile-w); height:var(--tile-h); border-radius:6px; position:relative; cursor:default;
    background:linear-gradient(160deg,#fffdf5,var(--tile) 55%,#e9e2cd);
    box-shadow:0 2px 0 var(--tile-edge), 0 3px 5px rgba(0,0,0,.45);
    border:1px solid #cfc6ad;
  }
  .tile .face{
    position:absolute; inset:0; padding:2px 1px; box-sizing:border-box;
    display:flex; align-items:center; justify-content:center; line-height:1;
  }
  .tile .face svg{ width:100%; height:100%; display:block; overflow:visible; }
  .tile.f{ background:linear-gradient(160deg,#ffeef5,#f7dbe6 60%,#ecc9d6); border-color:#d8a8bb;}
  .tile.small{ width:var(--small-w);height:var(--small-h);}
  .tile.mini{ width:var(--mini-w);height:var(--mini-h); border-radius:4px; box-shadow:0 1px 0 var(--tile-edge),0 1px 2px rgba(0,0,0,.4);}
  .tile.mini .face{ padding:1px; }
  .mini-row{ gap:5px; align-items:flex-end; }
</style>
</head>
<body>
  <h1>牌面预览</h1>
  <div style="font-size:12px;color:#9db8ab;margin-bottom:6px">共 42 种牌面，全部由 index.html 内的 TileArt 模块实时生成</div>

  <h2>标准尺寸 42×58（手牌）</h2>
  <div class="row" id="row-normal"></div>

  <h2>弃牌 / 副露尺寸 26×36（游戏内实际大小，桌面端）</h2>
  <div class="row mini-row" id="row-discard"></div>

  <h2>小尺寸 22×30（.tile.mini 基准档）</h2>
  <div class="row mini-row" id="row-mini"></div>

  <h2>同比例放大 84×116</h2>
  <div class="row" id="row-big"></div>

<script>
const CONFIG = (function(){
  return {
    BASE_POINT: 5,                       // 每花基础分
    WINDS: ['东','南','西','北'],
    HONOR: { z1:'东', z2:'南', z3:'西', z4:'北', z5:'中', z6:'發', z7:'白' },
    FLOWER: { f1:'春', f2:'夏', f3:'秋', f4:'冬', f5:'梅', f6:'蘭', f7:'竹', f8:'菊' },
    // 底花（连底）
    PATTERN: { menqing:4, qidui:10, pengpeng:6, qingyise:8, hunyise:6, shisanfeng:13 },
    PATTERN_NAME: { menqing:'门清', qidui:'七对子', pengpeng:'碰碰胡', qingyise:'清一色', hunyise:'混一色', shisanfeng:'十三风(全风板)' },
  };
})();

/* ============================ 模块2：TileUtils ============================ */
const TileUtils = (function(){
  const SUITS = ['m','p','s'];
  function rank(t){ return parseInt(t.slice(1),10); }
  function suit(t){ return t[0]; }
  function isHonor(t){ return t[0]==='z'; }
  function isFlower(t){ return t[0]==='f'; }
  function isWind(t){ return t[0]==='z' && t[1]>='1' && t[1]<='4'; }
  function isDragon(t){ return t[0]==='z' && t[1]>='5' && t[1]<='7'; }
  function name(t){
    if (isFlower(t)) return CONFIG.FLOWER[t];
    if (isHonor(t)) return CONFIG.HONOR[t];
    return rank(t)+({m:'万',p:'饼',s:'条'})[t[0]];
  }
  function sortKey(t){
    const so={m:0,p:1,s:2,z:3,f:4}[t[0]];
    return so*10+rank(t);
  }
  function sortHand(hand){ hand.sort((a,b)=>sortKey(a)-sortKey(b)); return hand; }
  // 全部牌（含花牌，共 144）
  function fullTileSet(){
    const arr=[];
    for (const s of SUITS) for (let r=1;r<=9;r++) for (let k=0;k<4;k++) arr.push(s+r);
    for (let r=1;r<=7;r++) for (let k=0;k<4;k++) arr.push('z'+r);
    for (let r=1;r<=8;r++) arr.push('f'+r);
    return arr;
  }
  return { rank, suit, isHonor, isFlower, isWind, isDragon, name, sortKey, sortHand, fullTileSet };
})();

/* ============================ 模块2.5：TileArt（矢量牌面） ============================
   用 SVG 画出真实麻将牌的刻纹：
     · 饼(筒)：同心圆点阵，按传统布局排布（3 斜排 / 7 为 3+2+2 / 9 为九宫）
     · 条(索)：竹节图形，1 条画雀鸟
     · 万：上方汉数字 + 下方红色「萬」
     · 字牌：東南西北中發白（白板为刻空方框）
     · 花牌：春夏秋冬梅蘭竹菊
   viewBox 统一 100×138，与牌面 42×58 同比例，任意尺寸缩放不失真。
=================================================================================== */
const TileArt = (function(){
  const VB='0 0 100 138';
  const T=TileUtils, CONF=CONFIG;
  // 注意：字体名用单引号，因为要放进双引号包裹的 HTML 属性里；用 JSON.stringify 会转义成 \" 导致 CSS 失效
  const SERIF = "'Songti SC','SimSun','STSong','Noto Serif CJK SC','Source Han Serif SC',serif";
  const F = 'font-family="' + SERIF + '"';

  /* 三色取自参考图逐像素采样（最饱和 5% 像素的中位色）：
     藏蓝 #2d3d67 · 深红 #af2b36 · 竹绿 #16663a
     绿色比参考图的 #2b7c46 略深：条子的描边只有 ~1px，太亮的绿在 42px 牌面上
     会被抗锯齿糊成浅灰（这正是之前「条子对比不明显」的根因），降明度保可读性。 */
  const COLOR = {
    navy:'#2d3d67', red:'#af2b36', green:'#16663a',
    greenPale:'#e8f2e8',
    manNum:'#2d3d67', manWan:'#af2b36',
    wind:'#2d3d67', whiteFrame:'#2d3d67', flower:'#c2185b'
  };

  /* ---------- 饼（筒）：三色同心圆靶心 ----------
     圆点不是「空心环 + 实心芯」，而是**实心圆挖两道白环**：
       实心圆 R → 白环 0.63R → 彩环 0.50R → 白环 0.24R → 彩芯 0.13R
     五个半径比例来自对参考图做「按半径统计彩色像素占比」的剖面测量，
     比目测copy可靠。位置/半径同样按参考图逐张连通域测量得出。 */
  const PIN = { B:COLOR.navy, G:COLOR.green, R:COLOR.red };
  function pinDot(cx,cy,R,key){
    const c=PIN[key], f=function(k){ return (R*k).toFixed(2); };
    return `<circle cx="${cx}" cy="${cy}" r="${f(1)}" fill="${c}"/>`+
           `<circle cx="${cx}" cy="${cy}" r="${f(0.63)}" fill="#fff"/>`+
           `<circle cx="${cx}" cy="${cy}" r="${f(0.50)}" fill="${c}"/>`+
           `<circle cx="${cx}" cy="${cy}" r="${f(0.24)}" fill="#fff"/>`+
           `<circle cx="${cx}" cy="${cy}" r="${f(0.13)}" fill="${c}"/>`;
  }
  // 每点 = [x, y, 色, 半径?]；不给半径就用该牌的默认 R
  const DOT_LAYOUT = {
    2:{R:17.2,pts:[[50,47,'B'],[50,97,'G']]},
    3:{R:12.0,pts:[[35,38,'B'],[50,68,'R'],[65,101,'G']]},
    4:{R:12.3,pts:[[34,36,'G'],[66,36,'B'],[34,102,'B'],[66,102,'G']]},
    5:{R:12.6,pts:[[36,36,'G'],[64,36,'B'],[50,70,'R'],[36,103,'B'],[64,103,'G']]},
    6:{R:10.6,pts:[[39,29,'G'],[61,29,'G'],[39,79,'R'],[61,79,'R'],[39,105,'R'],[61,105,'R']]},
    7:{R:10.9,pts:[[28,26,'G'],[50,36,'G'],[72,46,'G'],
                   [38,80,'R',12.1],[62,80,'R',12.1],[38,106,'R',12.1],[62,106,'R',12.1]]},
    8:{R:11.0,pts:[[37,28,'B'],[63,28,'B'],[37,54,'B'],[63,54,'B'],
                   [37,81,'B'],[63,81,'B'],[37,107,'B'],[63,107,'B']]},
    9:{R:10.0,pts:[[30,28,'B'],[50,28,'B'],[70,28,'B'],
                   [30,66,'R'],[50,66,'R'],[70,66,'R'],
                   [30,104,'G'],[50,104,'G'],[70,104,'G']]}
  };
  /* 一筒：团花。外藏蓝圈 + 12 瓣浅绿花环 + 中心红盘压白十字 */
  function pin1(){
    const cx=50, cy=70, R=34.5;
    let petals='';
    for (let i=0;i<12;i++){
      petals+=`<ellipse cx="${cx}" cy="${(cy-R*0.575).toFixed(1)}" rx="${(R*0.135).toFixed(1)}"`+
              ` ry="${(R*0.185).toFixed(1)}" fill="${COLOR.greenPale}" stroke="${COLOR.green}"`+
              ` stroke-width="1.5" transform="rotate(${i*30} ${cx} ${cy})"/>`;
    }
    const rr=R*0.40, bar=R*0.075;
    // 顺序：外圈 → 花瓣 → 白盘 → 红盘 → 白十字（白盘压住花瓣内端，和参考图一致）
    return `<circle cx="${cx}" cy="${cy}" r="${(R*0.935).toFixed(1)}" fill="none"`+
             ` stroke="${COLOR.navy}" stroke-width="${(R*0.13).toFixed(1)}"/>`+
           petals+
           `<circle cx="${cx}" cy="${cy}" r="${(R*0.47).toFixed(1)}" fill="#fff"/>`+
           `<circle cx="${cx}" cy="${cy}" r="${rr.toFixed(1)}" fill="${COLOR.red}"/>`+
           `<rect x="${(cx-bar/2).toFixed(1)}" y="${(cy-rr).toFixed(1)}" width="${bar.toFixed(1)}" height="${(rr*2).toFixed(1)}" fill="#fff"/>`+
           `<rect x="${(cx-rr).toFixed(1)}" y="${(cy-bar/2).toFixed(1)}" width="${(rr*2).toFixed(1)}" height="${bar.toFixed(1)}" fill="#fff"/>`;
  }
  function dotsSvg(n){
    if (n===1) return pin1();
    const L=DOT_LAYOUT[n]; if(!L) return '';
    return L.pts.map(function(p){ return pinDot(p[0],p[1],p[3]||L.R,p[2]); }).join('');
  }

  /* ---------- 条（索）：竹节 / 1 条为雀鸟 ----------
     排布全部按参考图连通域实测定值：
       6 条是 3 列 × 2 行（不是 2 列 × 3 行）；7 条顶部 1 根红竹 + 下方 3×2，
       中间那列是藏蓝；9 条是 3×3 且**中间一列**为红（筒子九是中间一行为红，两者不同）。*/
  const BAMBOO_LAYOUT = {
    2:{w:13.5,h:42, pts:[[50,46,0,'G'],[50,93,0,'G']]},
    3:{w:11,  h:46, pts:[[50,41,0,'G'],[30,94,0,'G'],[70,94,0,'G']]},
    4:{w:9.5, h:44, pts:[[35,41,0,'G'],[65,41,0,'G'],[35,100,0,'G'],[65,100,0,'G']]},
    5:{w:10,  h:45, pts:[[30,37,0,'G'],[70,37,0,'G'],[50,70,0,'R'],[30,103,0,'G'],[70,103,0,'G']]},
    6:{w:10.5,h:47, pts:[[30,44,0,'G'],[50,44,0,'G'],[70,44,0,'G'],[30,96,0,'G'],[50,96,0,'G'],[70,96,0,'G']]},
    7:{w:9,   h:32, pts:[[50,25,0,'R'],[30,64,0,'G'],[50,64,0,'B'],[70,64,0,'G'],
                         [30,102,0,'G'],[50,102,0,'B'],[70,102,0,'G']]},
    9:{w:10.5,h:34, pts:[[30,28,0,'G'],[50,28,0,'R'],[70,28,0,'G'],
                         [30,66,0,'G'],[50,66,0,'R'],[70,66,0,'G'],
                         [30,104,0,'G'],[50,104,0,'R'],[70,104,0,'G']]}
  };
  function bambooUnit(cx,cy,w,h,deg,key){
    const x=(cx-w/2).toFixed(1), y=(cy-h/2).toFixed(1), x2=(cx+w/2).toFixed(1);
    const y1=(cy-h*0.26).toFixed(1), y2=(cy+h*0.26).toFixed(1);
    // 描边不能太细：牌面 42px 时 SVG 缩放比仅约 0.42，
    // 低于 3 个 viewBox 单位就会被抗锯齿糊成浅色，凑近看才分辨得出竹节
    const M=PIN[key]||COLOR.green, sw=Math.max(3, Math.min(w,h)*0.24).toFixed(2);
    const inner=`<g>`+
      `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${(w/2).toFixed(1)}" fill="#fff" stroke="${M}" stroke-width="${sw}"/>`+
      `<line x1="${x}" y1="${y1}" x2="${x2}" y2="${y1}" stroke="${M}" stroke-width="${(sw*0.8).toFixed(2)}"/>`+
      `<line x1="${x}" y1="${y2}" x2="${x2}" y2="${y2}" stroke="${M}" stroke-width="${(sw*0.8).toFixed(2)}"/>`+
      `</g>`;
    if (!deg) return inner;
    // 斜置：绕自身中心旋转
    return `<g transform="rotate(${deg} ${cx} ${cy})">${inner}</g>`;
  }
  /* 已知两端点画一根竹：竹节单元是竖直的，绕中心转到目标方向。
     旋转角推导：SVG 里 (0,1)[向下] 旋转 θ 后为 (-sinθ, cosθ)，
     要让它对齐 (dx,dy) ⇒ θ = atan2(-dx, dy)。 */
  function bambooSeg(x1,y1,x2,y2,w,key){
    const cx=(x1+x2)/2, cy=(y1+y2)/2;
    const len=Math.sqrt((x2-x1)*(x2-x1)+(y2-y1)*(y2-y1));
    const deg=Math.atan2(-(x2-x1), (y2-y1))*180/Math.PI;
    return bambooUnit(cx,cy,w,len,deg,key);
  }
  /* 八条：上「W」下「M」，两半各 = 2 根竖竹 + 2 根斜竹，合计正好 8 根可数 */
  function bamboo8(){
    const w=10, vh=48, G='G';
    return [
      bambooUnit(25,42,w,vh,0,G), bambooUnit(75,42,w,vh,0,G),
      bambooSeg(25,66,50,20,9,G), bambooSeg(50,20,75,66,9,G),
      bambooUnit(25,98,w,vh,0,G), bambooUnit(75,98,w,vh,0,G),
      bambooSeg(25,74,50,120,9,G), bambooSeg(50,120,75,74,9,G)
    ].join('');
  }
  /* 一条：燕子。红冠红喙、白身藏蓝描边+羽纹、右侧翅、红长尾，绿枝叶衬底 */
  function birdSvg(){
    const G=COLOR.green, B=COLOR.navy, R=COLOR.red, W='#fff';
    return `<g>`+
      // 绿枝（衬在鸟后）
      `<path d="M74 20 C64 36 54 50 40 60 C26 70 17 88 21 110" fill="none" stroke="${G}" stroke-width="3.2" stroke-linecap="round"/>`+
      `<path d="M21 110 C26 98 36 92 48 92" fill="none" stroke="${G}" stroke-width="3" stroke-linecap="round"/>`+
      `<path d="M62 38 C72 30 84 33 90 43 C79 47 68 45 62 41 Z" fill="${G}"/>`+
      // 红色长尾
      `<path d="M60 68 C70 80 77 95 80 114" fill="none" stroke="${R}" stroke-width="5.5" stroke-linecap="round"/>`+
      // 身体（白底藏蓝描边）
      `<path d="M32 44 C42 33 56 36 60 50 C64 65 57 81 45 85 C33 89 25 78 25 64 C25 55 28 49 32 44 Z" fill="${W}" stroke="${B}" stroke-width="3"/>`+
      // 胸前羽纹
      `<path d="M36 53 L36 78 M42 51 L42 82 M48 53 L48 79 M54 57 L54 75" stroke="${B}" stroke-width="1.5" opacity=".6"/>`+
      // 翅（右侧，带格纹）
      `<path d="M46 47 C60 42 76 46 86 57 C75 62 62 62 50 59 Z" fill="${W}" stroke="${B}" stroke-width="2.6"/>`+
      `<path d="M52 51 L62 48 M55 57 L68 57 M63 51 L74 53" stroke="${B}" stroke-width="1.3" opacity=".6"/>`+
      // 头
      `<circle cx="38" cy="33" r="12" fill="${W}" stroke="${B}" stroke-width="3"/>`+
      // 冠羽（红）
      `<path d="M41 23 C45 13 57 8 69 12 C59 19 53 26 51 33 C47 26 44 23 41 23 Z" fill="${R}"/>`+
      // 喙（红，朝左）
      `<path d="M27 29 L10 36 L27 43 Z" fill="${R}"/>`+
      // 眼
      `<circle cx="35" cy="31" r="3.6" fill="none" stroke="${B}" stroke-width="1.8"/>`+
      `<circle cx="35" cy="31" r="1.2" fill="${B}"/>`+
      `</g>`;
  }
  function bambooSvg(n){
    if (n===1) return birdSvg();
    if (n===8) return bamboo8();
    const L=BAMBOO_LAYOUT[n]; if(!L) return '';
    return L.pts.map(function(p){ return bambooUnit(p[0],p[1],L.w,L.h,p[2],p[3]); }).join('');
  }

  /* ---------- 万：汉数字 + 萬 ---------- */
  const CN_NUM=['','一','二','三','四','五','六','七','八','九'];
  function manSvg(n){
    return `<text x="50" y="60" text-anchor="middle" ${F} font-size="38" font-weight="700" fill="${COLOR.manNum}">${CN_NUM[n]}</text>`+
           `<text x="50" y="118" text-anchor="middle" ${F} font-size="38" font-weight="700" fill="${COLOR.manWan}">萬</text>`;
  }

  /* ---------- 字牌 ---------- */
  const HONOR_FACE={ z1:['東',COLOR.wind], z2:['南',COLOR.wind], z3:['西',COLOR.wind], z4:['北',COLOR.wind],
                     z5:['中',COLOR.red],  z6:['發',COLOR.green] };
  function honorSvg(tile){
    const f=HONOR_FACE[tile];
    if (f) return `<text x="50" y="92" text-anchor="middle" ${F} font-size="56" font-weight="700" fill="${f[1]}">${f[0]}</text>`;
    // 白板：刻空方框
    return `<rect x="25" y="26" width="50" height="86" rx="5" fill="none" stroke="${COLOR.whiteFrame}" stroke-width="4"/>`+
           `<rect x="31" y="32" width="38" height="74" rx="3" fill="none" stroke="${COLOR.whiteFrame}" stroke-width="1.4" opacity=".45"/>`;
  }

  /* ---------- 花牌 ---------- */
  function flowerSvg(ch){
    return `<rect x="16" y="18" width="68" height="102" rx="7" fill="none" stroke="${COLOR.flower}" stroke-width="2.2" opacity=".45"/>`+
           `<text x="50" y="86" text-anchor="middle" ${F} font-size="44" font-weight="700" fill="${COLOR.flower}">${ch}</text>`;
  }

  /* ---------- 对外接口 ---------- */
  function faceSVG(tile){
    if (T.isFlower(tile)) return flowerSvg(CONF.FLOWER[tile]);
    if (T.isHonor(tile))  return honorSvg(tile);
    const r=T.rank(tile), s=tile[0];
    if (s==='m') return manSvg(r);
    if (s==='p') return dotsSvg(r);
    return bambooSvg(r);
  }
  function faceHTML(tile){
    return `<svg viewBox="${VB}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">${faceSVG(tile)}</svg>`;
  }
  return { faceHTML };
})();

var TILES = ["m1","m2","m3","m4","m5","m6","m7","m8","m9","p1","p2","p3","p4","p5","p6","p7","p8","p9","s1","s2","s3","s4","s5","s6","s7","s8","s9","z1","z2","z3","z4","z5","z6","z7","f1","f2","f3","f4","f5","f6","f7","f8"];

function fill(id, cls, style){
  var box = document.getElementById(id);
  TILES.forEach(function(t){
    var el = document.createElement('div');
    el.className = 'tile ' + (TileUtils.isFlower(t)?'f':TileUtils.isHonor(t)?'z':t[0]) + ' ' + cls;
    if (style) el.setAttribute('style', style);
    el.innerHTML = '<div class="face">' + TileArt.faceHTML(t) + '</div>';
    box.appendChild(el);
  });
}
fill('row-normal', '');
fill('row-discard', 'mini', 'width:26px;height:36px');
fill('row-mini', 'mini');
fill('row-big', '', 'width:84px;height:116px');
</script>

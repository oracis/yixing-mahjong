name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: 提取内联 JS 并做语法校验
        run: |
          node -e "
          const fs = require('fs');
          const s = fs.readFileSync('index.html', 'utf8');
          const m = s.match(/<script>([\s\S]*?)<\/script>/);
          if (!m) { console.error('未找到 <script> 块'); process.exit(1); }
          fs.writeFileSync('_check.js', m[1]);
          console.log('已提取 ' + m[1].length + ' 字节');
          "
          node --check _check.js
          echo "语法校验通过"
          rm -f _check.js

      - name: 规则引擎与端到端自测
        run: node test/selftest.js

      - name: 校验单文件完整性
        run: |
          node -e "
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const need = ['CONFIG', 'TileUtils', 'YixingRules', 'MahjongGame', 'AIPlayer', 'AudioEngine', 'Renderer', 'Controller'];
          const missing = need.filter(n => !html.includes('const ' + n));
          if (missing.length) { console.error('缺少模块: ' + missing.join(', ')); process.exit(1); }
          console.log('全部 ' + need.length + ' 个模块就位');
          // 确认没有外部依赖（零依赖承诺）
          const ext = html.match(/<(script|link)[^>]+(src|href)=[\"']https?:/g);
          if (ext) { console.error('存在外部资源引用，违反零依赖: ' + ext.join(', ')); process.exit(1); }
          console.log('零外部依赖确认通过');
          "
